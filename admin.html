<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hulugamee Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

header{
  background:#111a31;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #263554;
}

header h1{
  margin:0;
  color:#39e36b;
  font-size:25px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.card{
  background:#151f37;
  padding:20px;
  border-radius:18px;
  margin-bottom:16px;
}

.demo{
  color:#ffd75a;
  font-weight:bold;
  margin-bottom:8px;
}

label{
  display:block;
  color:#aab4ca;
  margin-top:15px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #334364;
  background:#0d1528;
  color:white;
  font-size:16px;
  outline:none;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

button{
  padding:14px;
  border:none;
  border-radius:11px;
  font-weight:bold;
  font-size:15px;
}

.add{
  background:#39e36b;
  color:#06100a;
}

.remove{
  background:#273452;
  color:white;
}

.result{
  display:none;
  margin-top:18px;
  background:#0d1528;
  padding:15px;
  border-radius:12px;
  color:#39e36b;
}

.info{
  color:#9eabc4;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <h1>🎮 Hulugamee Admin</h1>
</header>

<div class="container">

  <div class="card">

    <div class="demo">
      DEMO BALANCE CONTROL
    </div>

    <p class="info">
      As irraa balance virtual/demo taphattootaa
      dabalu ykn hir'isu dandeessa.
    </p>

    <label>Telegram ID</label>

    <input
      id="telegramId"
      type="text"
      placeholder="Fakkeenya: 123456789"
    >

    <label>Amount (ETB)</label>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="Fakkeenya: 1000"
    >

    <div class="buttons">

      <button
        class="add"
        onclick="changeBalance('add')">
        ➕ Add Balance
      </button>

      <button
        class="remove"
        onclick="changeBalance('remove')">
        ➖ Remove Balance
      </button>

    </div>

    <div id="result" class="result"></div>

  </div>

  <div class="card">

    <h3>📌 Fakkeenya</h3>

    <p class="info">
      Telegram ID: <b>123456789</b><br>
      Amount: <b>1000 ETB</b><br><br>

      Telegram ID fi amount galchi.
      Sana booda <b>Add Balance</b> cuqaasi.
    </p>

  </div>

</div>

<script>

async function changeBalance(action){

  const telegramId =
    document.getElementById("telegramId").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const result =
    document.getElementById("result");

  if(!telegramId || !amount || amount <= 0){

    result.style.display = "block";

    result.style.color = "#ff6b6b";

    result.textContent =
      "Telegram ID fi amount sirrii galchi.";

    return;
  }

  const endpoint =
    action === "add"
      ? "/api/admin/add-balance"
      : "/api/admin/remove-balance";

  try{

    const response = await fetch(endpoint,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        telegramId:telegramId,
        amount:amount
      })

    });

    const data = await response.json();

    result.style.display = "block";

    if(data.success){

      result.style.color = "#39e36b";

      result.textContent =
        data.message +
        " — Balance: " +
        data.balance +
        " ETB (demo)";

    }else{

      result.style.color = "#ff6b6b";

      result.textContent =
        data.message;

    }

  }catch(error){

    result.style.display = "block";

    result.style.color = "#ffd75a";

    result.textContent =
      "Backend amma hin connectamne. Demo UI qofa.";

  }

}

</script>

</body>
</html>
